<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mana Slot Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="slot-machine.css">
</head>
<body>
  <main id="app">
    <h1 class="slot-title">Mana Slots</h1>

    <div class="slot-cabinet">
      <div class="slot-window">
        <div class="slot-mask">
          <div class="slot-reel" id="reel">
            <!-- symbols injected by JS -->
          </div>
        </div>
      </div>

      <button class="slot-lever" id="lever">Pull</button>
    </div>
  </main>

  <footer id="app-footer">
    <a href="/" class="slot-home-link">Home</a>
  </footer>

  <script type="module" src="dist/slot-machine.js"></script>
</body>
</html>
