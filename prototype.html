<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* elliptical gradient: cool muted brown center, warm rich brown edges */
      background: radial-gradient(
        ellipse at center,
        #8D6137 0%,
        #7D572D 40%,
        #272817 100%
      );
    }

    h1 {
      color: #f0e0cc;
      font-family: Georgia, serif;
      font-size: 3rem;
      font-weight: normal;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <h1>hello world</h1>
</body>
</html>
