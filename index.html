<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTG Colors</title>
  <meta name="description" content="Learn the names of Magic: The Gathering color combinations through spaced repetition.">
  <meta property="og:title" content="MTG Colors">
  <meta property="og:description" content="Learn the names of Magic: The Gathering color combinations through spaced repetition.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mtgcolors.quest/">
  <meta property="og:site_name" content="MTG Colors">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <canvas id="gas"></canvas>
  <main id="app">
    <div class="welcome" id="welcome-screen">
      <h1 class="welcome-heading">Learn MTG Color Combinations</h1>
      <p class="welcome-instructions">
        I swear, this will work. Try it for 3 minutes.
    <br/>
        You'll know five color combos, and it will stick.
      </p>
      <ol class="welcome-instructions-list">
        <li>See a color combo</li>
        <li>Guess a name — any name. Say it out loud!</li>
        <li>When the right name appears, say it out loud too.</li>
      </ol>
      <button class="welcome-button" id="start-button">Learn guild names</button>
    </div>
  </main>
  <button id="gas-stop-btn" class="gas-btn" title="Freeze / Unfreeze">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="4" height="16" rx="1" fill="rgba(255,255,255,0.6)"/>
      <rect x="14" y="4" width="4" height="16" rx="1" fill="rgba(255,255,255,0.6)"/>
    </svg>
  </button>
  <button id="gas-fan-btn" class="gas-btn" title="Blow them around!">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="2" fill="rgba(255,255,255,0.8)"/>
      <path d="M12 10C12 10 12 2 7 2C2 2 2 10 12 10Z" fill="rgba(255,255,255,0.6)"/>
      <path d="M14 12C14 12 22 12 22 7C22 2 14 2 14 12Z" fill="rgba(255,255,255,0.6)"/>
      <path d="M12 14C12 14 12 22 17 22C22 22 22 14 12 14Z" fill="rgba(255,255,255,0.6)"/>
      <path d="M10 12C10 12 2 12 2 17C2 22 10 22 10 12Z" fill="rgba(255,255,255,0.6)"/>
    </svg>
  </button>
  <footer id="app-footer">
    <button id="settings-gear-btn" class="settings-gear-btn" title="Settings" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </footer>

  <!-- Settings panel -->
  <div id="settings-backdrop" class="settings-backdrop" hidden aria-hidden="true"></div>
  <div id="settings-panel" class="settings-panel" hidden role="dialog" aria-label="Settings" aria-modal="true">
    <button id="settings-close-btn" class="settings-close-btn" aria-label="Close settings">&times;</button>
    <h2 class="settings-title">Settings</h2>
    <div id="settings-version" class="settings-version"></div>
    <div id="settings-trace-container" class="settings-trace-container" hidden>
      <a id="settings-trace-link" class="settings-trace-link trace-link" target="_blank" rel="noopener noreferrer">Current trace</a>
    </div>
    <a class="settings-github-link" href="https://github.com/jessitron/mtg-sparrow" target="_blank" rel="noopener noreferrer">
      <img src="images/github-mark.svg" alt="" class="settings-github-icon" aria-hidden="true" width="16" height="16">
      GitHub
    </a>
    <hr class="settings-divider"/>
    <button id="settings-reset-btn" class="settings-reset-btn">Reset progress</button>
  </div>
  <script src="mana-gas.js"></script>
  <script type="module" src="dist/welcome.js"></script>
</body>
</html>
