<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <title>MTG Colors Logo</title>
  <style>
    :root {
      /* === LOGO VARIABLES === */

      /* Background circle */
      --bg-radius: 200px;

      /* Mana symbol sizing & positioning */
      --symbol-size: 100px;
      --symbol-orbit-radius: 192px;

      /* Symbol background circle */
      --symbol-outline-width: 2px;
      --symbol-outline-color: #ffffff;

      /* The five mana colors (WUBRG order, starting at top going clockwise) */
      --color-W: #F7EA3D;
      --color-U: #0E68AB;
      --color-B: #59289E;
      --color-R: #D3202A;
      --color-G: #00733E;

      /* Spiral */
      --spiral-start: 35;       /* degrees from top, counterclockwise */
      --spiral-turns: 3;
      --spiral-outer: 85;       /* % of bg radius */
      --spiral-inner: 8;        /* % of bg radius */
      --spiral-width: 25;       /* stroke width in SVG units */

      /* Text */
      --text-size: 14px;
      --text-color: #000000;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    .logo-container {
      position: relative;
      width: calc(var(--bg-radius) * 2);
      height: calc(var(--bg-radius) * 2);
    }

    .bg-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(var(--bg-radius) * 2);
      height: calc(var(--bg-radius) * 2);
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        var(--color-W) 0deg,
        var(--color-U) 72deg,
        var(--color-B) 144deg,
        var(--color-R) 216deg,
        var(--color-G) 288deg,
        var(--color-W) 360deg
      );
    }

    .spiral-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: none;
    }

    .mana-symbol-wrap {
      position: absolute;
      width: var(--symbol-size);
      height: var(--symbol-size);
      top: 50%;
      left: 50%;
    }

    .mana-symbol-wrap::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(100% + var(--symbol-outline-width) * 2);
      height: calc(100% + var(--symbol-outline-width) * 2);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--symbol-outline-color);
    }

    .mana-symbol {
      position: relative;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Pentagon placement: WUBRG from top, clockwise */
    .mana-symbol-wrap[data-color="W"] {
      transform: translate(
        calc(var(--symbol-orbit-radius) * 0 - var(--symbol-size) / 2),
        calc(var(--symbol-orbit-radius) * -1 - var(--symbol-size) / 2)
      );
    }
    .mana-symbol-wrap[data-color="U"] {
      transform: translate(
        calc(var(--symbol-orbit-radius) * 0.9511 - var(--symbol-size) / 2),
        calc(var(--symbol-orbit-radius) * -0.309 - var(--symbol-size) / 2)
      );
    }
    .mana-symbol-wrap[data-color="B"] {
      transform: translate(
        calc(var(--symbol-orbit-radius) * 0.5878 - var(--symbol-size) / 2),
        calc(var(--symbol-orbit-radius) * 0.809 - var(--symbol-size) / 2)
      );
    }
    .mana-symbol-wrap[data-color="R"] {
      transform: translate(
        calc(var(--symbol-orbit-radius) * -0.5878 - var(--symbol-size) / 2),
        calc(var(--symbol-orbit-radius) * 0.809 - var(--symbol-size) / 2)
      );
    }
    .mana-symbol-wrap[data-color="G"] {
      transform: translate(
        calc(var(--symbol-orbit-radius) * -0.9511 - var(--symbol-size) / 2),
        calc(var(--symbol-orbit-radius) * -0.309 - var(--symbol-size) / 2)
      );
    }

    .logo-text {
      position: absolute;
      left: 50%;
      top: calc(50% + var(--symbol-orbit-radius) * 0.809 + var(--symbol-size) / 2);
      transform: translate(-50%, -100%);
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: var(--text-size);
      color: var(--text-color);
      letter-spacing: 0.1em;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="bg-circle"></div>
    <svg class="spiral-svg" id="spiral-svg"></svg>
    <div class="mana-symbol-wrap" data-color="W"><img class="mana-symbol" src="images/logo/W.svg" alt="White"></div>
    <div class="mana-symbol-wrap" data-color="U"><img class="mana-symbol" src="images/logo/U.svg" alt="Blue"></div>
    <div class="mana-symbol-wrap" data-color="B"><img class="mana-symbol" src="images/logo/B.svg" alt="Black"></div>
    <div class="mana-symbol-wrap" data-color="R"><img class="mana-symbol" src="images/logo/R.svg" alt="Red"></div>
    <div class="mana-symbol-wrap" data-color="G"><img class="mana-symbol" src="images/logo/G.svg" alt="Green"></div>
    <div class="logo-text">mtgcolors.quest</div>
  </div>

  <script>
    // Generate spiral mask from CSS variables
    const root = getComputedStyle(document.documentElement);
    const bgRadius = parseFloat(root.getPropertyValue('--bg-radius'));
    const turns = parseFloat(root.getPropertyValue('--spiral-turns'));
    const strokeWidth = parseFloat(root.getPropertyValue('--spiral-width'));
    const startDeg = parseFloat(root.getPropertyValue('--spiral-start'));
    const outerPct = parseFloat(root.getPropertyValue('--spiral-outer')) / 100;
    const innerPct = parseFloat(root.getPropertyValue('--spiral-inner')) / 100;

    const size = bgRadius * 2;
    const cx = bgRadius;
    const cy = bgRadius;
    const outerR = bgRadius * outerPct;
    const innerR = bgRadius * innerPct;
    const startAngle = -Math.PI / 2 - (startDeg * Math.PI / 180);
    const totalAngle = turns * 2 * Math.PI;
    const steps = Math.round(turns * 120);
    const points = [];

    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const r = outerR - (outerR - innerR) * t;
      const angle = startAngle - t * totalAngle;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      points.push(`${x.toFixed(2)},${y.toFixed(2)}`);
    }

    const d = 'M ' + points[0] + ' L ' + points.slice(1).join(' ');
    const maskSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}"><path d="${d}" fill="none" stroke="white" stroke-width="${strokeWidth}" stroke-linecap="round"/></svg>`;
    const maskUrl = `url("data:image/svg+xml,${encodeURIComponent(maskSvg)}")`;
    const bgCircle = document.querySelector('.bg-circle');
    bgCircle.style.maskImage = maskUrl;
    bgCircle.style.webkitMaskImage = maskUrl;
    bgCircle.style.maskSize = '100% 100%';
    bgCircle.style.webkitMaskSize = '100% 100%';
  </script>
</body>
</html>
