<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Spiral Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem;
      background-color: #3b2314;
      color: #d2b48c;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    h1 {
      margin-bottom: 1rem;
      font-size: 1.4rem;
      color: #f5deb3;
    }

    .controls {
      margin-bottom: 1rem;
      display: flex;
      gap: 0.75rem;
    }

    button {
      padding: 0.5rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
      border: 1px solid #d2b48c;
      background: #5a3a1a;
      color: #f5deb3;
      border-radius: 4px;
    }

    button:hover {
      background: #7a5a3a;
    }

    .canvas-area {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
    }

    svg {
      border: 1px solid #5a3a1a;
    }

    #side-container {
      position: relative;
      background: #3b2314;
      border: 1px solid #5a3a1a;
      overflow: hidden;
    }

    #paper-strip {
      width: 100%;
      height: 0;
      background: #e8dcc8;
      /* Subtle paper texture via layered gradients */
      background-image:
        linear-gradient(180deg, rgba(0,0,0,0.03) 0%, transparent 2px),
        linear-gradient(0deg, rgba(0,0,0,0.02) 0%, transparent 1px);
      background-size: 100% 8px, 100% 4px;
    }

    #coil-rect {
      position: absolute;
      left: 0;
      width: 100%;
      height: 0;
      background: linear-gradient(
        to bottom,
        #6b5130 0%,
        #d4b88a 25%,
        #c4a474 45%,
        #8a6d42 75%,
        #5a3f20 100%
      );
      border-top: 1px solid #5a3f20;
      border-bottom: 1px solid #5a3f20;
    }

    #analysis {
      margin-top: 1rem;
      padding: 1rem;
      background: #2a1508;
      border: 1px solid #5a3a1a;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      min-width: 300px;
    }
  </style>
</head>
<body>
  <h1>Scroll Spiral Prototype</h1>

  <div class="controls">
    <button id="btn-unroll">Unroll</button>
    <button id="btn-roll">Roll Up</button>
  </div>

  <div class="canvas-area">
    <svg id="spiral-svg"></svg>
    <div id="side-container">
      <div id="paper-strip"></div>
      <div id="coil-rect"></div>
    </div>
  </div>

  <div id="analysis"></div>

  <script>
    // ============================================================
    // TUNABLE PARAMETERS — tweak these!
    // ============================================================

    const STROKE_WIDTH = 6;        // Thickness of the spiral line (px)
    const TURN_GAP = 6;            // Gap between successive turns (px), a.k.a. "pitch"
    const SPIRAL_LENGTH = 800;     // Total arc length of the curved line (px)
    const ANIMATION_DURATION = 1500; // Duration of unroll/roll animation (ms)
    const STOP_REMAINING = 20;     // Remaining coiled length when unroll stops (px)
    const Z_DEPTH = 600;            // Width of the paper going "into" screen (px)
    const SVG_PADDING = 20;         // Padding around the spiral in the SVG

    // Colors
    const SPIRAL_COLOR = '#d2b48c'; // khaki
    const LINE_COLOR = '#d2b48c';
    const BG_COLOR = '#3b2314';

    // Archimedean spiral: r = a + b*θ
    // where b = (TURN_GAP + STROKE_WIDTH) / (2π)
    // "a" is the innermost radius (we'll use STROKE_WIDTH as minimum)

    const a = STROKE_WIDTH;  // inner radius — leave room for the center
    const b = (TURN_GAP + STROKE_WIDTH) / (2 * Math.PI);  // radial growth per radian

    // ============================================================
    // STEP 1: Compute the spiral path as a polyline
    // ============================================================

    // We sample the spiral at small angular increments and accumulate arc length.
    // We stop when we've reached SPIRAL_LENGTH.

    const ANGLE_STEP = 0.05; // radians per sample — small for smooth curve

    function buildSpiralPoints() {
      // First pass: compute points without rotation to find the outermost angle
      const rawPoints = [];
      let totalLength = 0;
      let theta = 0;

      let r = a + b * theta;
      rawPoints.push({ theta, r, arcLength: 0 });

      while (totalLength < SPIRAL_LENGTH) {
        theta += ANGLE_STEP;
        r = a + b * theta;

        const prev = rawPoints[rawPoints.length - 1];
        const prevR = prev.r;
        const prevTheta = prev.theta;
        // Distance between consecutive points on the spiral
        const dx = r * Math.cos(theta) - prevR * Math.cos(prevTheta);
        const dy = r * Math.sin(theta) - prevR * Math.sin(prevTheta);
        const segLen = Math.sqrt(dx * dx + dy * dy);
        totalLength += segLen;

        rawPoints.push({ theta, r, arcLength: totalLength });
      }

      // The outermost point is the last one (highest theta, largest r).
      // We want it on the LEFT, i.e. at angle π in Cartesian coords.
      // Its natural angle is theta_max (mod 2π). We apply a rotation offset.
      const thetaMax = rawPoints[rawPoints.length - 1].theta;
      // Natural direction of outermost point: thetaMax
      // We want it at π, so rotation = π - thetaMax
      const rotationOffset = Math.PI - thetaMax;

      // Second pass: apply rotation and compute x,y
      // Using (cos, +sin) so the spiral winds clockwise in SVG's Y-down coords
      // when traced outer→inner (after reversal). The unroll animation is
      // unaffected — it positions the remaining coil by bounding box, not
      // winding direction.
      const points = rawPoints.map(p => ({
        theta: p.theta,
        r: p.r,
        x: p.r * Math.cos(p.theta + rotationOffset),
        y: p.r * Math.sin(p.theta + rotationOffset),
        arcLength: p.arcLength
      }));

      return points;
    }

    const spiralPoints = buildSpiralPoints();

    // Reverse so index 0 = outermost (largest radius) = the anchor point.
    // The spec says "start" of the spiral is the outermost point.
    spiralPoints.reverse();

    // Recompute arc lengths from the new start (outermost)
    spiralPoints[0].arcLength = 0;
    for (let i = 1; i < spiralPoints.length; i++) {
      const prev = spiralPoints[i - 1];
      const dx = spiralPoints[i].x - prev.x;
      const dy = spiralPoints[i].y - prev.y;
      spiralPoints[i].arcLength = prev.arcLength + Math.sqrt(dx * dx + dy * dy);
    }

    const totalArcLength = spiralPoints[spiralPoints.length - 1].arcLength;

    // ============================================================
    // Theta-to-arc-length lookup table for angular animation
    // ============================================================
    // Build from the raw spiral: theta goes from 0 (inner) to thetaMax (outer).
    // At each theta, arcLength is cumulative from inner.
    // "unrollAngle" measures how much angle has been peeled off from the outer end.
    // unrollAngle = thetaMax - theta, unrolledArcLength = totalArcLength - arcLength(theta).
    // The table maps unrollAngle → unrolledArcLength (both monotonically increasing).

    function buildThetaToArcTable() {
      const table = [];
      let len = 0;
      let theta = 0;
      let r = a + b * theta;
      table.push({ theta, arcLength: 0 });

      while (len < SPIRAL_LENGTH) {
        theta += ANGLE_STEP;
        r = a + b * theta;
        const prev = table[table.length - 1];
        const prevR = a + b * prev.theta;
        const dx = r * Math.cos(theta) - prevR * Math.cos(prev.theta);
        const dy = r * Math.sin(theta) - prevR * Math.sin(prev.theta);
        len += Math.sqrt(dx * dx + dy * dy);
        table.push({ theta, arcLength: len });
      }
      return table;
    }

    const rawTable = buildThetaToArcTable();
    const THETA_MAX = rawTable[rawTable.length - 1].theta;
    const RAW_TOTAL_ARC = rawTable[rawTable.length - 1].arcLength;

    // Build the unroll lookup: unrollAngle → unrolledArcLength
    // Entries go from unrollAngle=0 (fully coiled) to unrollAngle=THETA_MAX (fully unrolled)
    const unrollLookup = rawTable.map(entry => ({
      unrollAngle: THETA_MAX - entry.theta,
      unrolledArcLength: RAW_TOTAL_ARC - entry.arcLength,
    })).reverse(); // reverse so unrollAngle increases from 0

    // Find the theta that corresponds to STOP_REMAINING
    // We want unrolledArcLength = totalArcLength - STOP_REMAINING
    const maxUnrolledArc = RAW_TOTAL_ARC - STOP_REMAINING;
    let THETA_STOP = THETA_MAX;
    for (let i = 0; i < unrollLookup.length; i++) {
      if (unrollLookup[i].unrolledArcLength >= maxUnrolledArc) {
        THETA_STOP = unrollLookup[i].unrollAngle;
        break;
      }
    }

    // Interpolate: given unrollAngle, return unrolledArcLength
    function thetaToArcLength(unrollAngle) {
      if (unrollAngle <= 0) return 0;
      if (unrollAngle >= THETA_MAX) return RAW_TOTAL_ARC;

      // Binary search for the right interval
      let lo = 0, hi = unrollLookup.length - 1;
      while (lo < hi - 1) {
        const mid = (lo + hi) >> 1;
        if (unrollLookup[mid].unrollAngle <= unrollAngle) lo = mid;
        else hi = mid;
      }

      const a0 = unrollLookup[lo];
      const a1 = unrollLookup[hi];
      const frac = (unrollAngle - a0.unrollAngle) / (a1.unrollAngle - a0.unrollAngle);
      return a0.unrolledArcLength + frac * (a1.unrolledArcLength - a0.unrolledArcLength);
    }

    // ============================================================
    // Compute bounding box of the full spiral for SVG sizing
    // ============================================================

    function getBBox(pts) {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of pts) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      return { minX, maxX, minY, maxY };
    }

    const fullBBox = getBBox(spiralPoints);

    // ============================================================
    // SVG setup
    // ============================================================

    const spiralSvg = document.getElementById('spiral-svg');
    const sideContainer = document.getElementById('side-container');
    const paperStripEl = document.getElementById('paper-strip');
    const coilRectEl = document.getElementById('coil-rect');

    // Size the spiral SVG to contain the full spiral + room for unrolled line
    // The unrolled line extends downward from the anchor point.
    // Anchor = outermost point (index 0), which is on the LEFT side.

    // The anchor (spiralPoints[0]) sits at a fixed SVG position. The coil can
    // extend above the anchor (the portion of the spiral above the leftmost point).
    // We need enough room above the anchor for that, plus room below for the
    // straight line + remaining coil at full unroll.
    const anchorPt = spiralPoints[0];
    const extentAboveAnchor = anchorPt.y - fullBBox.minY + STROKE_WIDTH / 2;
    const extentBelowAnchor = fullBBox.maxY - anchorPt.y + STROKE_WIDTH / 2;
    const fullCoilDiameter = (fullBBox.maxY - fullBBox.minY) + STROKE_WIDTH;
    const fullCoilWidth = (fullBBox.maxX - fullBBox.minX) + STROKE_WIDTH;
    const maxUnrollLength = totalArcLength - STOP_REMAINING;

    // The anchor Y in SVG coords: needs room above for the coil's upper extent
    const ANCHOR_Y = SVG_PADDING + extentAboveAnchor;

    const svgWidth = fullCoilWidth + SVG_PADDING * 2;
    const svgHeight = Math.max(
      ANCHOR_Y + extentBelowAnchor + SVG_PADDING,
      ANCHOR_Y + maxUnrollLength + fullCoilDiameter + SVG_PADDING
    );

    spiralSvg.setAttribute('width', svgWidth);
    spiralSvg.setAttribute('height', svgHeight);
    spiralSvg.style.background = BG_COLOR;

    // Create spiral path element
    const spiralPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    spiralPath.setAttribute('fill', 'none');
    spiralPath.setAttribute('stroke', SPIRAL_COLOR);
    spiralPath.setAttribute('stroke-width', STROKE_WIDTH);
    spiralPath.setAttribute('stroke-linecap', 'round');
    spiralSvg.appendChild(spiralPath);

    // Wall line (dashed) in spiral view
    const wallLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    wallLine.setAttribute('x1', SVG_PADDING + STROKE_WIDTH / 2);
    wallLine.setAttribute('y1', 0);
    wallLine.setAttribute('x2', SVG_PADDING + STROKE_WIDTH / 2);
    wallLine.setAttribute('y2', svgHeight);
    wallLine.setAttribute('stroke', '#666');
    wallLine.setAttribute('stroke-width', 1);
    wallLine.setAttribute('stroke-dasharray', '4,4');
    spiralSvg.appendChild(wallLine);

    // Create unrolled portion path (straight line along wall + connector to coil)
    const straightPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    straightPath.setAttribute('fill', 'none');
    straightPath.setAttribute('stroke', LINE_COLOR);
    straightPath.setAttribute('stroke-width', STROKE_WIDTH);
    straightPath.setAttribute('stroke-linecap', 'round');
    straightPath.setAttribute('visibility', 'hidden');
    spiralSvg.appendChild(straightPath);

    // The initial coil top Y in SVG coords (when fully rolled, unrolledLength=0).
    // This is where the paper strip's top edge stays pinned in the side projection.
    const initialCoilTopY = fullBBox.minY + (ANCHOR_Y - spiralPoints[0].y);

    // ============================================================
    // Rendering functions
    // ============================================================

    // Generate a fresh spiral of a given arc length, with outermost point on the left.
    // Uses the same a, b parameters as the main spiral.
    // Returns points in outer-to-inner order (for drawing).
    function buildCoilForLength(targetLength) {
      if (targetLength < 1) return [];
      const pts = [];
      let len = 0;
      let theta = 0;
      let r = a + b * theta;
      pts.push({ theta, r });

      while (len < targetLength) {
        theta += ANGLE_STEP;
        r = a + b * theta;
        const prev = pts[pts.length - 1];
        const dx = r * Math.cos(theta) - prev.r * Math.cos(prev.theta);
        const dy = r * Math.sin(theta) - prev.r * Math.sin(prev.theta);
        len += Math.sqrt(dx * dx + dy * dy);
        pts.push({ theta, r });
      }

      // Rotate so outermost point (highest theta) lands on the LEFT (angle π)
      const thetaMax = pts[pts.length - 1].theta;
      const rot = Math.PI - thetaMax;

      // Apply rotation, compute x/y, same formula as the main spiral
      const result = pts.map(p => ({
        x: p.r * Math.cos(p.theta + rot),
        y: p.r * Math.sin(p.theta + rot)
      }));

      // Reverse so index 0 = outermost (on the left)
      result.reverse();
      return result;
    }

    // ============================================================
    // Pure computation: mirrors computeProjection() in cylinder-projection.js
    // ============================================================

    // Compute all frame values from unrolledLength — no DOM access.
    // Returns { remainingPoints, aX, aY, txX, txY, coilBBox, coilDiameter,
    //           coilTopY, lineEndY, unrolledLength, remainingLength,
    //           projection (CSS values for side view) }
    function computeFrame(rawUnrolledLength) {
      const unrolledLength = Math.max(0, Math.min(rawUnrolledLength, totalArcLength - STOP_REMAINING));
      const remainingLength = totalArcLength - unrolledLength;

      // Generate remaining coil as a fresh spiral of the right length.
      const remainingPoints = unrolledLength === 0
        ? spiralPoints
        : buildCoilForLength(remainingLength);

      if (remainingPoints.length < 2) return null;

      const aX = SVG_PADDING + STROKE_WIDTH / 2;
      const aY = ANCHOR_Y;

      const coilBBox = getBBox(remainingPoints);
      const coilCY = (coilBBox.minY + coilBBox.maxY) / 2;
      const lineEndY = aY + unrolledLength;

      const splitPt = remainingPoints[0];
      const txX = aX - coilBBox.minX;
      const txY = lineEndY - splitPt.y;

      const coilDiameter = Math.max(
        coilBBox.maxX - coilBBox.minX,
        coilBBox.maxY - coilBBox.minY
      ) + STROKE_WIDTH;
      const coilTopY = coilBBox.minY + txY;
      const coilSvgCX = (coilBBox.minX + coilBBox.maxX) / 2 + txX;
      const coilSvgCY = coilCY + txY;

      // CSS projection values (same as computeProjection in cylinder-projection.js)
      const projection = {
        paperStripMarginTop: aY,
        paperStripHeight: Math.max(0, unrolledLength),
        coilRectTop: coilTopY,
        coilRectHeight: coilDiameter > STROKE_WIDTH * 2 ? coilDiameter : 0,
        coilDiameter,
        containerHeight: svgHeight,
      };

      return {
        remainingPoints, aX, aY, txX, txY, coilBBox, coilDiameter,
        coilTopY, lineEndY, unrolledLength, remainingLength,
        coilSvgCX, coilSvgCY, projection,
      };
    }

    // ============================================================
    // DOM rendering: applies computed values to the page
    // ============================================================

    function render(rawUnrolledLength) {
      const frame = computeFrame(rawUnrolledLength);
      if (!frame) return;

      const {
        remainingPoints, aX, aY, txX, txY, coilBBox, coilDiameter,
        coilTopY, lineEndY, unrolledLength, remainingLength,
        coilSvgCX, coilSvgCY, projection,
      } = frame;

      // Build the SVG path for the remaining spiral
      let d = '';
      for (let i = 0; i < remainingPoints.length; i++) {
        const px = remainingPoints[i].x + txX;
        const py = remainingPoints[i].y + txY;
        d += (i === 0 ? 'M' : 'L') + px.toFixed(2) + ',' + py.toFixed(2);
      }
      spiralPath.setAttribute('d', d);

      // Draw straight line along wall from anchor to coil connection
      if (unrolledLength > 0) {
        let sd = `M${aX.toFixed(2)},${aY.toFixed(2)}`;
        sd += ` L${aX.toFixed(2)},${lineEndY.toFixed(2)}`;
        straightPath.setAttribute('d', sd);
        straightPath.setAttribute('visibility', 'visible');
      } else {
        straightPath.setAttribute('visibility', 'hidden');
      }

      // Update analysis panel
      const analysisEl = document.getElementById('analysis');
      analysisEl.innerHTML = `
        <div>Total spiral length: ${totalArcLength.toFixed(1)} px</div>
        <div>Unrolled (straight) length: ${unrolledLength.toFixed(1)} px</div>
        <div>Remaining coiled length: ${remainingLength.toFixed(1)} px</div>
        <div>Stop remaining: ${STOP_REMAINING} px</div>
        <div>───────────────────────</div>
        <div>Straight line height: ${unrolledLength.toFixed(1)} px</div>
        <div>Remaining coil diameter: ${coilDiameter.toFixed(1)} px</div>
        <div>Remaining coil center (SVG): (${coilSvgCX.toFixed(1)}, ${coilSvgCY.toFixed(1)})</div>
        <div>Coil top Y (SVG): ${coilTopY.toFixed(1)}</div>
      `;

      // Apply CSS projection values to the side view
      sideContainer.style.width = Z_DEPTH + 'px';
      sideContainer.style.height = projection.containerHeight + 'px';

      paperStripEl.style.marginTop = projection.paperStripMarginTop + 'px';
      paperStripEl.style.height = projection.paperStripHeight + 'px';

      if (projection.coilRectHeight > 0) {
        coilRectEl.style.top = projection.coilRectTop + 'px';
        coilRectEl.style.height = projection.coilRectHeight + 'px';
        coilRectEl.style.display = 'block';
      } else {
        coilRectEl.style.display = 'none';
      }
    }

    // ============================================================
    // Initial render (fully coiled)
    // ============================================================
    render(0);

    // ============================================================
    // STEP 2 & 3: Animation — constant angular velocity
    // ============================================================
    // Instead of interpolating unrolledLength, we interpolate the unroll
    // angle (theta) linearly. Since outer turns have more circumference,
    // the paper growth is fast at first (big coil) and decelerates (small coil).

    let currentTheta = 0;  // current unroll angle in radians
    let animationId = null;

    function animateToTheta(targetTheta) {
      if (animationId) cancelAnimationFrame(animationId);

      const startTheta = currentTheta;
      const startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        const t = Math.min(elapsed / ANIMATION_DURATION, 1);
        // Ease in-out applied to theta — angular velocity ramps up, cruises, ramps down
        const eased = t < 0.5
          ? 2 * t * t
          : 1 - Math.pow(-2 * t + 2, 2) / 2;
        currentTheta = startTheta + (targetTheta - startTheta) * eased;

        // Look up the corresponding unrolledLength from the theta-to-arc table
        const unrolledLength = thetaToArcLength(currentTheta);
        render(unrolledLength);

        if (t < 1) {
          animationId = requestAnimationFrame(step);
        } else {
          animationId = null;
        }
      }

      animationId = requestAnimationFrame(step);
    }

    document.getElementById('btn-unroll').addEventListener('click', () => {
      animateToTheta(THETA_STOP);
    });

    document.getElementById('btn-roll').addEventListener('click', () => {
      animateToTheta(0);
    });
  </script>
</body>
</html>
