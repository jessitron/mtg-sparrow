<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTG Color Wheel — Test Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
      color: #c8b88a;
    }

    svg {
      max-width: 480px;
      width: 100%;
      height: auto;
    }

    /* Node base styles */
    .color-node {
      stroke-width: 2.5;
    }

    /* Line styles */
    .ally-line {
      stroke: #c8b88a;
      stroke-width: 2;
      opacity: 0.75;
    }

    .enemy-line {
      stroke: #8888cc;
      stroke-width: 1.5;
      stroke-dasharray: 6 4;
      opacity: 0.5;
    }

    /* Legend */
    .legend {
      margin-top: 1.5rem;
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 0.85rem;
      color: #aaa;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .legend-item img {
      width: 28px;
      height: 28px;
    }

    .legend-item span {
      font-family: 'Georgia', serif;
    }
  </style>
</head>
<body>
  <h1>MTG Color Wheel — Test Page</h1>

  <!--
    Layout math (viewBox 0 0 400 400, center 200 200, radius 150, node-radius 34):
    Colors in clockwise order starting at 12 o'clock (-90°):
      White (i=0):  angle=-90°  → (200.00,  50.00)
      Blue  (i=1):  angle=-18°  → (342.66, 153.65)
      Black (i=2):  angle= 54°  → (288.17, 321.35)
      Red   (i=3):  angle=126°  → (111.83, 321.35)
      Green (i=4):  angle=198°  → ( 57.34, 153.65)

    Allied (pentagon) edges: W-U, U-B, B-R, R-G, G-W
    Enemy  (star)     edges: W-B, W-R, U-R, U-G, B-G

    Image positioning: x = cx - 34, y = cy - 34, width=68, height=68
  -->

  <svg
    viewBox="0 0 400 400"
    xmlns="http://www.w3.org/2000/svg"
    aria-label="MTG Color Wheel"
    role="img"
  >
    <!-- ===== LINES (drawn first, behind nodes) ===== -->

    <!-- Allied lines (pentagon edges) -->
    <line id="line-white-blue"
      class="ally-line"
      x1="200.00" y1="50.00"
      x2="342.66" y2="153.65"
      stroke-dasharray="200"
      stroke-dashoffset="0"
    />
    <line id="line-blue-black"
      class="ally-line"
      x1="342.66" y1="153.65"
      x2="288.17" y2="321.35"
      stroke-dasharray="200"
      stroke-dashoffset="0"
    />
    <line id="line-black-red"
      class="ally-line"
      x1="288.17" y1="321.35"
      x2="111.83" y2="321.35"
      stroke-dasharray="200"
      stroke-dashoffset="0"
    />
    <line id="line-red-green"
      class="ally-line"
      x1="111.83" y1="321.35"
      x2="57.34"  y2="153.65"
      stroke-dasharray="200"
      stroke-dashoffset="0"
    />
    <line id="line-green-white"
      class="ally-line"
      x1="57.34"  y1="153.65"
      x2="200.00" y2="50.00"
      stroke-dasharray="200"
      stroke-dashoffset="0"
    />

    <!-- Enemy lines (star / pentagram diagonals) -->
    <line id="line-white-black"
      class="enemy-line"
      x1="200.00" y1="50.00"
      x2="288.17" y2="321.35"
      stroke-dasharray="300"
      stroke-dashoffset="0"
    />
    <line id="line-white-red"
      class="enemy-line"
      x1="200.00" y1="50.00"
      x2="111.83" y2="321.35"
      stroke-dasharray="300"
      stroke-dashoffset="0"
    />
    <line id="line-blue-red"
      class="enemy-line"
      x1="342.66" y1="153.65"
      x2="111.83" y2="321.35"
      stroke-dasharray="300"
      stroke-dashoffset="0"
    />
    <line id="line-blue-green"
      class="enemy-line"
      x1="342.66" y1="153.65"
      x2="57.34"  y2="153.65"
      stroke-dasharray="300"
      stroke-dashoffset="0"
    />
    <line id="line-black-green"
      class="enemy-line"
      x1="288.17" y1="321.35"
      x2="57.34"  y2="153.65"
      stroke-dasharray="300"
      stroke-dashoffset="0"
    />

    <!-- ===== NODES ===== -->

    <!-- White — top (12 o'clock) -->
    <g id="node-white" class="color-node color-white">
      <image href="images/W.svg" x="166.00" y="16.00" width="68" height="68" />
    </g>

    <!-- Blue — upper right -->
    <g id="node-blue" class="color-node color-blue">
      <image href="images/U.svg" x="308.66" y="119.65" width="68" height="68" />
    </g>

    <!-- Black — lower right -->
    <g id="node-black" class="color-node color-black">
      <image href="images/B.svg" x="254.17" y="287.35" width="68" height="68" />
    </g>

    <!-- Red — lower left -->
    <g id="node-red" class="color-node color-red">
      <image href="images/R.svg" x="77.83" y="287.35" width="68" height="68" />
    </g>

    <!-- Green — upper left -->
    <g id="node-green" class="color-node color-green">
      <image href="images/G.svg" x="23.34" y="119.65" width="68" height="68" />
    </g>

  </svg>

  <div class="legend">
    <div class="legend-item">
      <img src="images/W.svg" alt="White mana symbol" />
      <span>White</span>
    </div>
    <div class="legend-item">
      <img src="images/U.svg" alt="Blue mana symbol" />
      <span>Blue</span>
    </div>
    <div class="legend-item">
      <img src="images/B.svg" alt="Black mana symbol" />
      <span>Black</span>
    </div>
    <div class="legend-item">
      <img src="images/R.svg" alt="Red mana symbol" />
      <span>Red</span>
    </div>
    <div class="legend-item">
      <img src="images/G.svg" alt="Green mana symbol" />
      <span>Green</span>
    </div>
  </div>

  <p style="margin-top: 1rem; font-size: 0.8rem; color: #666; font-family: monospace;">
    Allied lines: gold solid &nbsp;|&nbsp; Enemy lines: blue dashed
  </p>
</body>
</html>
