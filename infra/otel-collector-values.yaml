# OTel Collector Helm values for mtg-sparrow
# Deployed to: orion cluster, mtg-sparrow namespace
# Chart: open-telemetry/opentelemetry-collector
#
# IMPORTANT: The helm chart merges default config with our values.
# We explicitly null out unwanted defaults to keep the config minimal.
# See "Nulled defaults" comments below.

mode: deployment

replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  tag: ""  # uses appVersion from chart

# Service configuration
service:
  type: ClusterIP

ports:
  # We only want OTLP HTTP. Disable everything else.
  otlp:
    enabled: false                 # no gRPC
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  health-check:
    enabled: true
    containerPort: 13133
    servicePort: 13133
    protocol: TCP
  metrics:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  receivers:
    otlp:
      protocols:
        # Nulled default: gRPC receiver — we only accept OTLP over HTTP
        grpc: null
        http:
          endpoint: 0.0.0.0:4318
          cors:
            allowed_origins:
              - "https://mtgcolors.quest"
              - "http://localhost:*"
    # Nulled defaults: receivers we don't use
    jaeger: null
    zipkin: null
    prometheus: null

  processors:
    batch:
      timeout: 1s
      send_batch_size: 1024
    memory_limiter:
      check_interval: 1s
      limit_mib: 200
      spike_limit_mib: 50
    resource/provenance:
      attributes:
        - key: collector.name
          value: mtg-sparrow.jessitron.honeydemo.io
          action: upsert
        - key: collector.cluster
          value: orion
          action: upsert

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  exporters:
    otlp_http/honeycomb:
      endpoint: https://api.honeycomb.io
      headers:
        x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
    # Nulled default: debug exporter
    debug: null

  # Nulled default: no connectors
  connectors: null

  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, resource/provenance, batch]
        exporters: [otlp_http/honeycomb]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, resource/provenance, batch]
        exporters: [otlp_http/honeycomb]
      # Nulled default: metrics pipeline (we don't export metrics)
      metrics: null

# Inject the Honeycomb API key from a Kubernetes secret
extraEnvs:
  - name: HONEYCOMB_API_KEY
    valueFrom:
      secretKeyRef:
        name: honeycomb-api-key
        key: api-key

# Resource limits - minimal for a low-traffic static site
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi
