# OTel Collector Helm values for mtg-sparrow
# Deployed to: orion cluster, mtg-sparrow namespace
# Chart: open-telemetry/opentelemetry-collector

mode: deployment

replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  tag: ""  # uses appVersion from chart

# Service configuration - expose OTLP HTTP and gRPC
service:
  type: ClusterIP

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  health-check:
    enabled: true
    containerPort: 13133
    servicePort: 13133
    protocol: TCP
  # Disable ports we don't need
  metrics:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
          cors:
            allowed_origins:
              - "https://mtgcolors.quest"
              - "http://localhost:*"

  processors:
    batch:
      timeout: 1s
      send_batch_size: 1024
    memory_limiter:
      check_interval: 1s
      limit_mib: 200
      spike_limit_mib: 50

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  exporters:
    otlp_http/honeycomb:
      endpoint: https://api.honeycomb.io
      headers:
        x-honeycomb-team: ${env:HONEYCOMB_API_KEY}

  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/honeycomb]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/honeycomb]

# Inject the Honeycomb API key from a Kubernetes secret
extraEnvs:
  - name: HONEYCOMB_API_KEY
    valueFrom:
      secretKeyRef:
        name: honeycomb-api-key
        key: api-key

# Resource limits - minimal for a low-traffic static site
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi
